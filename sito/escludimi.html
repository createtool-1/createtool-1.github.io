<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Escludi le mie visite</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f6f7f5;color:#1d2420;display:flex;min-height:90vh;align-items:center;justify-content:center;margin:0;padding:20px}.b{background:#fff;border:1px solid #dfe5e0;border-radius:16px;padding:26px;max-width:400px;text-align:center}h1{font-size:20px;margin:0 0 10px}p{color:#5b665f;line-height:1.5}button{background:#2d6a52;color:#fff;border:0;border-radius:12px;padding:12px 20px;font:600 15px inherit;margin-top:8px}</style></head><body><div class="b"><h1 id="t"></h1><p id="p"></p><button id="x"></button></div><script>function m(){var s=localStorage.getItem("skipgc")==="t";document.getElementById("t").textContent=s?"Le tue visite NON vengono contate":"Le tue visite vengono contate";document.getElementById("p").textContent=s?"Da questo browser e su questo dispositivo il contatore ti ignora.":"Tocca il tasto per escludere questo browser dal contatore.";document.getElementById("x").textContent=s?"Torna a contare le mie visite":"Escludi le mie visite";}try{if(localStorage.getItem("skipgc")!=="t"&&location.hash!=="#no")localStorage.setItem("skipgc","t");}catch(e){}document.getElementById("x").onclick=function(){if(localStorage.getItem("skipgc")==="t")localStorage.removeItem("skipgc");else localStorage.setItem("skipgc","t");m();};m();</script></body></html>
